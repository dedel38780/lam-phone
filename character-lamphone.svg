<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" role="img" aria-label="Technicien Lam Phone vêtu de noir, casquette et tee-shirt LAMPHONE, réparation à domicile secteur Vienne">
  <defs>
    <radialGradient id="skin" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#f2c9a2"/>
      <stop offset="60%" stop-color="#e0a878"/>
      <stop offset="100%" stop-color="#c98e62"/>
    </radialGradient>
    <linearGradient id="tee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#23252b"/>
      <stop offset="55%" stop-color="#14161a"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191a1f"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20232a"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9dfe7"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7a5230"/>
      <stop offset="100%" stop-color="#2c1e10"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e09a78" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e09a78" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ombre au sol -->
  <ellipse cx="210" cy="610" rx="130" ry="16" fill="#0b1f3a" opacity="0.18"/>

  <!-- Jambes (jean noir) -->
  <path d="M170 404 L158 576 L180 576 L192 404 Z" fill="url(#jeans)"/>
  <path d="M228 404 L240 576 L262 576 L250 404 Z" fill="url(#jeans)"/>
  <path d="M175 408 L164 572" stroke="#0a0b0e" stroke-width="1.5" fill="none"/>
  <path d="M245 408 L256 572" stroke="#0a0b0e" stroke-width="1.5" fill="none"/>

  <!-- Sneakers -->
  <path d="M128 574 h70 a18 18 0 0 1 18 18 v8 a8 8 0 0 1 -8 8 h-80 a8 8 0 0 1 -8 -8 v-8 a18 18 0 0 1 8 -18 Z" fill="url(#shoe)"/>
  <path d="M222 574 h70 a18 18 0 0 1 18 18 v8 a8 8 0 0 1 -8 8 h-80 a8 8 0 0 1 -8 -8 v-8 a18 18 0 0 1 8 -18 Z" fill="url(#shoe)"/>
  <path d="M132 588 h64" stroke="#c0c8d2" stroke-width="2"/>
  <path d="M226 588 h64" stroke="#c0c8d2" stroke-width="2"/>
  <path d="M130 600 h70 v4 a8 8 0 0 1 -8 8 h-54 a8 8 0 0 1 -8 -8 Z" fill="#b9c2cd"/>
  <path d="M224 600 h70 v4 a8 8 0 0 1 -8 8 h-54 a8 8 0 0 1 -8 -8 Z" fill="#b9c2cd"/>

