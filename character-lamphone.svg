  <path d="M270 236 C 278 284, 276 344, 262 398" stroke="#000000" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- Plis du tissu -->
  <path d="M196 244 C 202 268, 198 300, 204 330" stroke="#000000" stroke-width="3" fill="none" opacity="0.28"/>
  <path d="M224 246 C 230 272, 226 306, 232 336" stroke="#000000" stroke-width="3" fill="none" opacity="0.28"/>
  <path d="M164 420 Q 210 436 256 420" stroke="#ffffff" stroke-width="4" fill="none" opacity="0.06"/>

