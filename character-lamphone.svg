  <path d="M281 341 a7.5 7.5 0 0 1 14 0 v29 a7.5 7.5 0 0 1 -14 0 Z" fill="url(#skin)"/>
  <path d="M272 366 L300 366" stroke="#a5744b" stroke-width="5" stroke-linecap="round" opacity="0.65"/>

