  <path d="M211 122 Q 224 116 237 122 L 234 128 Q 224 124 214 128 Z" fill="#d9c4a8" opacity="0.55"/>
  <circle cx="223" cy="127" r="6.5" fill="url(#iris)"/>
  <circle cx="223" cy="127" r="3" fill="#17180f"/>
  <circle cx="220.5" cy="124.5" r="1.8" fill="#ffffff"/>
  <path d="M213 121 Q 224 115 236 121 M213 121 L213 126" stroke="#3a2a1c" stroke-width="1.6" fill="none"/>

  <!-- Nez -->
  <path d="M210 112 L207 142 Q 210 150 213 142 Z" fill="#b9854f" opacity="0.3"/>
  <ellipse cx="204" cy="147" rx="3.4" ry="2.8" fill="#a06a3f"/>
  <ellipse cx="216" cy="147" rx="3.4" ry="2.8" fill="#a06a3f"/>
  <path d="M210 143 Q 208 152 210 155" stroke="#b9854f" stroke-width="1.6" fill="none" opacity="0.6"/>

  <!-- Bouche (sourire) -->
  <path d="M192 158 Q 201 154 210 157 Q 219 154 228 158 Q 220 166 210 165 Q 200 166 192 158 Z" fill="#a85f4a"/>
  <path d="M194 161 Q 210 172 226 161 Q 210 171 194 161 Z" fill="#d18c74"/>
  <path d="M194 160 Q 210 166 226 160" stroke="#8c4c38" stroke-width="1.4" fill="none" opacity="0.8"/>

  <!-- Pommettes -->
  <circle cx="186" cy="148" r="13" fill="url(#blush)"/>
  <circle cx="234" cy="148" r="13" fill="url(#blush)"/>

  <!-- CASQUETTE -->
  <path d="M156 88 Q 150 42 210 42 Q 270 42 264 88 L264 100 L156 100 Z" fill="url(#capG)"/>
  <path d="M156 88 Q 210 44 264 88" stroke="#000000" stroke-width="3" fill="none" opacity="0.35"/>
  <circle cx="210" cy="46" r="5" fill="#0a0b0e"/>
  <path d="M188 54 Q 186 70 190 92" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.05"/>
  <path d="M232 54 Q 234 70 230 92" stroke="#000000" stroke-width="2.5" fill="none" opacity="0.25"/>
  <path d="M160 88 Q 210 100 260 88" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.07"/>
  <!-- Texte sur la casquette -->
  <text x="210" y="84" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="3" text-anchor="middle" fill="#0ea5e9">LAMPHONE</text>
  <text x="210" y="84" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="800" font-size="13" letter-spacing="3" text-anchor="middle" fill="#ffffff" opacity="0.13">LAMPHONE</text>
  <!-- Visière -->
  <path d="M154 98 Q 210 124 266 98 L 270 112 Q 210 140 150 112 Z" fill="#08090b"/>
  <path d="M154 98 Q 210 124 266 98" stroke="#3d4148" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M192 112 Q 210 118 228 112" stroke="#000000" stroke-width="2" fill="none" opacity="0.6"/>
</svg>