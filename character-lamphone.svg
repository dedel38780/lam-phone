  <text x="210" y="272" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="3.5" text-anchor="middle" fill="#0ea5e9">LAMPHONE</text>
  <text x="210" y="272" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="3.5" text-anchor="middle" fill="#ffffff" opacity="0.14">LAMPHONE</text>
  <rect x="176" y="286" width="68" height="3" rx="1.5" fill="#22d3ee"/>

