  <ellipse cx="140" cy="372" rx="17" ry="20" fill="url(#skin)"/>
  <path d="M130 352 a7.5 7.5 0 0 1 14 0 v20 a7.5 7.5 0 0 1 -14 0 Z" fill="url(#skin)"/>
  <path d="M139 349 a7.5 7.5 0 0 1 14 0 v23 a7.5 7.5 0 0 1 -14 0 Z" fill="url(#skin)"/>
  <path d="M148 352 a7.5 7.5 0 0 1 14 0 v20 a7.5 7.5 0 0 1 -14 0 Z" fill="url(#skin)"/>

  <!-- Téléphone dans la main droite -->
  <rect x="300" y="288" width="60" height="118" rx="15" fill="#0f172a" stroke="#2c3648" stroke-width="2.5"/>
  <rect x="306" y="304" width="48" height="84" rx="7" fill="#0b1f3a"/>
  <rect x="310" y="312" width="40" height="62" rx="5" fill="url(#scr)"/>
  <text x="330" y="350" font-family="Poppins, Segoe UI, Arial, sans-serif" font-weight="800" font-size="26" text-anchor="middle" fill="#ffffff">38</text>
  <rect x="322" y="382" width="16" height="4" rx="2" fill="#475569"/>
  <ellipse cx="330" cy="298" rx="7" ry="2.5" fill="#0b1f3a"/>

