  <path d="M212 107 Q 226 102 238 108" stroke="#231b12" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Œil gauche -->
  <ellipse cx="196" cy="127" rx="13" ry="8" fill="#fbfcfe" stroke="#c9ccd4" stroke-width="1"/>
  <path d="M183 122 Q 196 116 209 122 L 206 128 Q 196 124 186 128 Z" fill="#d9c4a8" opacity="0.55"/>
  <circle cx="197" cy="127" r="6.5" fill="url(#iris)"/>
  <circle cx="197" cy="127" r="3" fill="#17180f"/>
  <circle cx="194.5" cy="124.5" r="1.8" fill="#ffffff"/>
  <path d="M184 120 Q 196 115 207 121 M207 121 L207 126" stroke="#3a2a1c" stroke-width="1.6" fill="none"/>

