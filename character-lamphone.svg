  <path d="M136 210 C 118 238, 124 306, 140 366 L154 412 C 176 424, 244 424, 266 412 L280 366 C 296 306, 302 238, 284 210 C 262 198, 232 192, 210 192 C 188 192, 158 198, 136 210 Z" fill="url(#tee)"/>
