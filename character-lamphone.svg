  <ellipse cx="160" cy="132" rx="9" ry="13" fill="#d9a070"/>
  <ellipse cx="260" cy="132" rx="9" ry="13" fill="#d9a070"/>
  <path d="M160 124 a4 6 0 0 1 4 8" stroke="#b9854f" stroke-width="1.6" fill="none" opacity="0.7"/>

