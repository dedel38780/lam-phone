  <path d="M196 172 h28 a6 6 0 0 1 6 6 v20 a6 6 0 0 1 -6 6 h-28 a6 6 0 0 1 -6 -6 v-20 a6 6 0 0 1 6 -6 Z" fill="url(#skin)"/>
  <path d="M198 186 h24" stroke="#b37f57" stroke-width="2" opacity="0.4"/>
  <!-- Col rond + ombre intérieure -->
  <path d="M176 196 Q210 214 244 196 L244 204 Q210 224 176 204 Z" fill="#0a0b0e"/>
  <path d="M182 206 Q210 222 238 206" stroke="#000000" stroke-width="3" fill="none" opacity="0.45"/>

