  <path d="M142 208 C 128 228, 126 252, 132 272 C 135 281, 147 283, 151 276 C 160 262, 162 240, 158 202 Z" fill="url(#tee)"/>
  <path d="M278 208 C 292 228, 294 252, 288 272 C 285 281, 273 283, 269 276 C 260 262, 258 240, 262 202 Z" fill="url(#tee)"/>

