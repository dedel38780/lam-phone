  <path d="M160 104 C 154 128, 156 146, 166 158 L176 150 C 168 136, 167 118, 172 102 Z" fill="#171512"/>
  <path d="M260 104 C 266 128, 264 146, 254 158 L244 150 C 252 136, 253 118, 248 102 Z" fill="#171512"/>

