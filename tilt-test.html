<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Tilt - Lam Phone</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; text-align: center; background: #f4f8fc; color: #0c4a6e; }
  h1 { font-size: 22px; margin: 24px 16px 4px; }
  p { margin: 6px 16px; font-size: 14px; color: #334155; }
  #val { font-size: 72px; font-weight: 800; margin: 12px 0 4px; color: #0369a1; }
  #barwrap { margin: 20px auto; width: 260px; }
  #bar { height: 18px; border-radius: 9px; background: linear-gradient(90deg,#0ea5e9,#0369a1); width: 40px; }
  .info { font-size: 12px; color: #64748b; margin: 8px 16px 30px; }
  #mouse { font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
  <h1>TEST CAPTEUR INCLINAISON</h1>
  <p>Penche le téléphone à gauche / droite, ou bouge la souris sur PC.</p>
  <div id="val">--</div>
  <p id="lbl">Gamma (inclinaison)</p>
  <div id="barwrap"><div id="bar"></div></div>
  <p id="mouse">Souris PC : non reçue</p>
  <p class="info">Sur iPhone : touche l'écran PUIS autorise « Mouvement et orientation ». Sur PC : bouge la souris.</p>
  <p class="info"><a href="https://dedel38780.github.io/lam-phone/">Retour au site</a></p>
  <script>
    var val = document.getElementById("val");
    var bar = document.getElementById("bar");
    var mouse = document.getElementById("mouse");
    var ok = false;

    window.addEventListener("mousemove", function (e) {
      mouse.textContent = "Souris PC : recue (" + e.clientX + "px)";
      var rel = (e.clientX / window.innerWidth) - 0.5;
      val.textContent = Math.round(rel * 90) + "°";
      bar.style.transform = "translateX(" + (rel * 130) + "px)";
    });

    function onO(e) {
      ok = true;
      var g = e.gamma || 0;
      val.textContent = Math.round(g) + "°";
      lbl.textContent = "Gamma (inclinaison) = " + Math.round(g) + (g < 0 ? " -> vers la DROITE" : " -> vers la GAUCHE");
      bar.style.transform = "translateX(" + Math.max(-100, Math.min(100, g)) * 2 + "px)";
    }

    function ask() {
      if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
        DeviceOrientationEvent.requestPermission().then(function (s) {
          if (s === "granted") window.addEventListener("deviceorientation", onO);
          else lbl.textContent = "Permission refuse - reglage : Accessibilite > Mouvement";
        }).catch(function () {});
      } else {
        window.addEventListener("deviceorientation", onO);
      }
    }

    var first = function () {
      window.removeEventListener("touchstart", first);
      document.removeEventListener("click", first);
      ask();
    };
    window.addEventListener("touchstart", first, { passive: true });
    document.addEventListener("click", first);
    ask();
  </script>
</body>
</html>
